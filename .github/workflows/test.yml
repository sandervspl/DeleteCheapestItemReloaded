name: Unit tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DeleteCheapestItem Reloaded
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua and Busted
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 lua-busted

      - name: Install Mechanic v1.4.2
        run: |
          git clone --branch v1.4.2 --depth 1 https://github.com/Falkicon/Mechanic.git "$RUNNER_TEMP/Mechanic"
          python -m pip install --editable "$RUNNER_TEMP/Mechanic/desktop"

      - name: Check Lua 5.1 syntax
        run: luac5.1 -p DeleteCheapestItem.lua Localization.lua Tests/*.lua

      - name: Run tests through Mechanic
        run: mech call addon.test '{"addon":"DeleteCheapestItem","path":"."}'

      - name: Verify the Busted exit status with Lua 5.1
        run: busted --lua=lua5.1

      - name: Test local deployment
        shell: pwsh
        run: ./Tests/copy_to_wow_spec.ps1
