name: Package and publish addon

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Check out release and tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This revision recognizes Forever (16001/camelot), as well as Era, BCC and Mists.
      # One archive declares all four interfaces; separate builds are unnecessary.
      - name: Package and publish all supported clients
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -n "{package-name}-Reloaded-{project-version}"
